stages: [test, build]

backend:
  stage: test
  image: node:22-bookworm-slim
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends openssl
  script:
    - cd backend
    - npm ci --ignore-scripts
    - npx prisma generate
    - npm run typecheck
    - npm test
  rules:
    - changes: [backend/**/*]

frontend:
  stage: test
  image: node:22-bookworm-slim
  script:
    - cd frontend
    - npm ci --ignore-scripts
    - npx nuxt prepare
    - npm run build
  rules:
    - changes: [frontend/**/*]

docker-build:
  stage: build
  image: docker:27
  services: [docker:27-dind]
  script:
    - docker build --target prod -t sainte-lucie-backend ./backend
    - docker build --target prod -t sainte-lucie-frontend ./frontend
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
