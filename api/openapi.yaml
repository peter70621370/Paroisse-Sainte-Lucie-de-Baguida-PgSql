openapi: 3.0.3
info:
  title: API - Paroisse Sainte Lucie de Baguida
  version: 0.1.0
  description: Contrat de l'API REST (source de référence entre frontend et backend).
servers:
  - url: http://localhost:4000
    description: Développement
paths:
  /api/health:
    get:
      summary: Liveness - le serveur répond
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
  /api/health/ready:
    get:
      summary: Readiness - le serveur et la base de données répondent
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  database: { type: string, example: up }
        '503':
          description: Base de données indisponible
  /api/auth/login:
    post:
      summary: Connexion (cookie de session httpOnly). Limité à 5 tentatives par minute.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200': { description: Connecté, cookie "sid" posé, renvoie { user } }
        '400': { description: Données invalides }
        '401': { description: E-mail ou mot de passe incorrect }
        '429': { description: Trop de tentatives }
  /api/auth/logout:
    post:
      summary: Déconnexion (supprime la session)
      responses:
        '200': { description: OK }
  /api/auth/me:
    get:
      summary: Utilisateur connecté
      responses:
        '200': { description: "{ user: { id, email, firstName, lastName, role } }" }
        '401': { description: Non connecté }
  /api/admin/users:
    get:
      summary: Liste des utilisateurs (rôle ADMIN uniquement)
      responses:
        '200': { description: "{ users: [...] }" }
        '401': { description: Non connecté }
        '403': { description: Rôle insuffisant }
  /api/auth/password:
    post:
      summary: Changer son propre mot de passe (ferme les autres sessions)
      responses:
        '200': { description: OK }
        '400': { description: Mot de passe actuel incorrect ou nouveau trop court }
  /api/admin/users/{id}:
    patch:
      summary: Modifier un utilisateur (ADMIN). Impossible de modifier son propre rôle ou de laisser 0 administrateur actif.
      responses:
        '200': { description: "{ user }" }
        '400': { description: Règle métier violée }
        '404': { description: Introuvable }
  /api/admin/media:
    get:
      summary: Liste paginée des fichiers (query page, pageSize, type=image|pdf, q)
      responses:
        '200': { description: "{ total, page, pageSize, items }" }
    post:
      summary: Envoi d'un fichier (multipart, champ "file"). Images converties en WebP (2000 px max) + miniature ; PDF acceptés. 10 Mo max.
      responses:
        '201': { description: "{ media }" }
        '413': { description: Fichier trop volumineux }
        '415': { description: Type non autorisé (vérifié sur le contenu réel) }
  /api/admin/media/{id}:
    patch:
      summary: Modifier le texte alternatif (ADMIN, EDITOR)
      responses:
        '200': { description: "{ media }" }
    delete:
      summary: Supprimer un fichier (ADMIN, EDITOR). 409 s'il est utilisé (ex. bulletin).
      responses:
        '200': { description: OK }
        '409': { description: Fichier utilisé }
  /api/settings:
    get:
      summary: Paramètres publics (identité, logo, accueil, coordonnées, réseaux sociaux). Une image vide = image provisoire.
      responses:
        '200': { description: "{ settings }" }
  /api/admin/settings:
    get:
      summary: Paramètres modifiables (ADMIN, EDITOR)
      responses:
        '200': { description: "{ settings, fields: [{ key, label, type, group }] }" }
    put:
      summary: Mettre à jour des paramètres (clés connues uniquement)
      responses:
        '200': { description: "{ settings }" }
        '400': { description: Clé inconnue ou valeur invalide }
  /uploads/{path}:
    get:
      summary: Fichier public de la médiathèque (cache long, noms aléatoires)
      responses:
        '200': { description: Fichier }
        '404': { description: Introuvable }
  /api/admin/{resource}:
    get:
      summary: "Liste paginée (page, pageSize, status, q). resource = pages | announcements | bulletins | mass-schedules | staff | homilies"
      responses:
        '200': { description: "{ items, total, page, pageSize }" }
    post:
      summary: |
        Création. Le HTML (content) est nettoyé côté serveur. status=PUBLISHED pose publishedAt (date future = publication programmée).
        Contributeur : brouillons uniquement (403 sinon) ; horaires et personnel : ADMIN/EDITOR.
      responses:
        '201': { description: "{ item }" }
        '400': { description: Données invalides }
        '403': { description: Droits insuffisants }
        '409': { description: Doublon (ex. même slug et même langue) }
  /api/admin/{resource}/{id}:
    get:
      summary: Détail
      responses:
        '200': { description: "{ item }" }
    patch:
      summary: Modification partielle (mêmes règles que la création)
      responses:
        '200': { description: "{ item }" }
    delete:
      summary: Suppression (ADMIN, EDITOR)
      responses:
        '200': { description: OK }
  /api/pages/{slug}:
    get:
      summary: Page publiée (query locale, défaut fr)
      responses:
        '200': { description: "{ page }" }
        '404': { description: Brouillon, programmée dans le futur, ou inexistante }
  /api/announcements:
    get:
      summary: Annonces publiées et non expirées, épinglées en premier
      responses:
        '200': { description: "{ items }" }
  /api/bulletins:
    get:
      summary: Bulletins publiés (PDF), du plus récent au plus ancien (page, pageSize)
      responses:
        '200': { description: "{ items, total }" }
  /api/mass-schedules:
    get:
      summary: Horaires actifs, du lundi au dimanche
      responses:
        '200': { description: "{ items }" }
  /api/staff:
    get:
      summary: Personnel pastoral actif
      responses:
        '200': { description: "{ items }" }
  /api/homilies:
    get:
      summary: Homélies publiées (page, pageSize)
      responses:
        '200': { description: "{ items, total }" }
  /api/homilies/{id}:
    get:
      summary: Une homélie publiée (avec texte)
      responses:
        '200': { description: "{ homily }" }
        '404': { description: Introuvable ou non publiée }
  /api/forms/{slug}:
    post:
      summary: |
        Formulaire public. slug = contact | membership | catechism | sacrament | mass-intention.
        Consentement obligatoire (consent: true). Champ piège "website" : doit rester vide.
        5 envois / 10 min / IP. Notifie le secrétariat par e-mail et accuse réception au visiteur.
      responses:
        '201': { description: "{ ok: true }" }
        '400': { description: "Données invalides : { error, details: { champ: [messages] } }" }
        '404': { description: Formulaire inconnu }
        '429': { description: Trop d'envois }
  /api/events:
    get:
      summary: Événements publiés d'une période (query from, to = AAAA-MM-JJ ; défaut 90 jours ; 400 jours max ; category = slug)
      responses:
        '200': { description: "{ items }" }
        '400': { description: Période invalide }
  /api/events/{id}:
    get:
      summary: Un événement publié
      responses:
        '200': { description: "{ event }" }
        '404': { description: Introuvable ou brouillon }
  /api/event-categories:
    get:
      summary: Catégories d'événements
      responses:
        '200': { description: "{ items }" }
  /api/admin/submissions:
    get:
      summary: "Demandes reçues (ADMIN, EDITOR) — query type, status, q, page, pageSize"
      responses:
        '200': { description: "{ items, total }" }
        '403': { description: Contributeur }
  /api/admin/submissions/summary:
    get:
      summary: Nombre de nouvelles demandes (total et par type)
      responses:
        '200': { description: "{ new, byType }" }
  /api/admin/submissions/export.csv:
    get:
      summary: Export CSV (séparateur « ; », UTF-8 avec BOM, formules neutralisées)
      responses:
        '200': { description: Fichier CSV }
  /api/admin/submissions/{id}:
    get:
      summary: Détail d'une demande
      responses:
        '200': { description: "{ item }" }
    patch:
      summary: Changer le statut (NEW | PROCESSED | ARCHIVED)
      responses:
        '200': { description: OK }
    delete:
      summary: Supprimer (ADMIN uniquement)
      responses:
        '200': { description: OK }
  /api/donations/methods:
    get:
      summary: Moyens de paiement disponibles (selon la configuration) avec devise et limites
      responses:
        '200': { description: "{ mode: live|mock, methods: [{ method, label, currency, limits }] }" }
  /api/donations:
    post:
      summary: |
        Crée un don « en attente » et renvoie l'adresse de paiement du prestataire { reference, redirectUrl }.
        method = MOBILE_MONEY | CARD (FCFA, multiples de 5, 500 à 2 000 000, nom et téléphone requis) ou PAYPAL (euros entiers, 1 à 5 000).
        Consentement obligatoire. 10 créations / 10 min / IP.
      responses:
        '201': { description: "{ reference, redirectUrl }" }
        '400': { description: Données invalides }
        '502': { description: Prestataire injoignable }
        '503': { description: Moyen de paiement non configuré }
  /api/donations/{ref}/confirm:
    post:
      summary: Vérifie le paiement auprès du prestataire (page de retour). Idempotent. Ne renvoie aucune donnée personnelle.
      responses:
        '200': { description: "{ reference, status, amount, currency, method, campaign }" }
        '404': { description: Don introuvable }
  /api/donations/webhook/cinetpay:
    post:
      summary: Notification CinetPay (cpm_trans_id). Déclenche une vérification, jamais une validation directe. GET : test de disponibilité.
      responses:
        '200': { description: "{ ok: true }" }
  /api/donations/webhook/paypal:
    post:
      summary: Notification PayPal. Retrouve la commande, vérifie auprès de PayPal (capture si approuvée).
      responses:
        '200': { description: "{ ok: true }" }
  /api/campaigns:
    get:
      summary: Campagnes publiées en cours avec progression (dons réussis ; euros convertis à 655,957)
      responses:
        '200': { description: "{ items }" }
  /api/campaigns/{slug}:
    get:
      summary: Une campagne
      responses:
        '200': { description: "{ campaign }" }
        '404': { description: Introuvable }
  /api/admin/donations:
    get:
      summary: Dons (ADMIN, EDITOR) — query status, method, from, to, q, page
      responses:
        '200': { description: "{ items, total }" }
  /api/admin/donations/summary:
    get:
      summary: Totaux (par devise, équivalent FCFA), nombre de dons, en attente
      responses:
        '200': { description: "{ byCurrency, totalXof, count, pending, stalePending }" }
  /api/admin/donations/export.csv:
    get:
      summary: Export CSV (formules neutralisées)
      responses:
        '200': { description: Fichier CSV }
  /api/admin/donations/{id}/recheck:
    post:
      summary: Revérifie un don en attente auprès du prestataire
      responses:
        '200': { description: "{ item }" }
  /api/sitemap:
    get:
      summary: Contenus publiés pour le sitemap (pages, homélies, événements, albums)
      responses:
        '200': { description: "{ pages, homilies, events, albums }" }
  /api/pages/{slug}/locales:
    get:
      summary: Langues dans lesquelles une page publiée existe
      responses:
        '200': { description: "{ locales: [fr, ee] }" }
  /api/analytics/hit:
    post:
      summary: Compte une page vue, de façon anonyme (envoyé seulement si le visiteur a accepté). Ignore robots, « Ne pas me suivre » et pages privées.
      responses:
        '204': { description: Toujours 204 }
  /api/admin/analytics:
    get:
      summary: Statistiques (ADMIN, EDITOR) — query days (1 à 365)
      responses:
        '200': { description: "{ totals, series, topPages, referrers, devices }" }
  /api/newsletter/subscribe:
    post:
      summary: Inscription (double confirmation par e-mail). Réponse identique que l'adresse soit déjà inscrite ou non. 5 / 10 min / IP.
      responses:
        '201': { description: "{ ok: true }" }
  /api/newsletter/confirm:
    post:
      summary: Confirme l'inscription (jeton reçu par e-mail)
      responses:
        '200': { description: "{ ok: true }" }
        '404': { description: Lien invalide }
  /api/newsletter/unsubscribe:
    post:
      summary: Désinscription (jeton dans le corps JSON ou dans l'adresse ?token=, pour le « un clic » des messageries)
      responses:
        '200': { description: "{ ok: true }" }
  /api/admin/subscribers:
    get:
      summary: Abonnés (ADMIN, EDITOR) — query status, q, page ; export.csv ; summary ; DELETE /{id} réservé aux ADMIN
      responses:
        '200': { description: "{ items, total }" }
  /api/admin/newsletters:
    get:
      summary: Historique des envois
      responses:
        '200': { description: "{ items }" }
    post:
      summary: Envoie une lettre à tous les abonnés confirmés (en arrière-plan, 202). HTML nettoyé ; /test envoie à une seule adresse.
      responses:
        '202': { description: "{ item: { id, status } }" }
  /api/albums:
    get:
      summary: Albums publiés (couverture = image choisie, sinon première photo)
      responses:
        '200': { description: "{ items }" }
  /api/albums/{slug}:
    get:
      summary: Un album publié avec ses photos et vidéos
      responses:
        '200': { description: "{ album }" }
        '404': { description: Introuvable }
  /api/admin/albums/{id}/items:
    post:
      summary: Ajoute une photo (mediaId, image de la médiathèque) OU une vidéo (videoUrl http/https), avec légende. Réordonner : POST .../items/reorder { ids }.
      responses:
        '201': { description: "{ item }" }
        '400': { description: Données invalides }
