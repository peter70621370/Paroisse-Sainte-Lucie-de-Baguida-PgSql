# Déploiement sur Render, version GRATUITE de DÉMONSTRATION (https://render.com).
# Dans Render : New > Blueprint, choisir ce dépôt. Marche à suivre : README, section « Déploiement sur Render ».
#
# Limites de l'offre gratuite, à connaître :
# - la base est SUPPRIMÉE par Render au bout d'environ un mois ;
# - pas de disque : les fichiers téléversés sont perdus à chaque redémarrage (le contenu d'exemple est recréé au démarrage) ;
# - les services s'endorment après 15 minutes sans visite (réveil : une à deux minutes) ;
# - pas d'envoi d'e-mails.
# Pour le site réel : deploiement/render.payant.yaml.
#
# Si Render attribue d'autres adresses que les deux « onrender.com » ci-dessous (nom déjà pris),
# les corriger dans l'onglet Environment de chaque service.

databases:
  - name: sainte-lucie-db
    region: frankfurt
    plan: free
    postgresMajorVersion: "17"
    databaseName: sainte_lucie
    user: sainte_lucie
    ipAllowList: []            # aucune connexion depuis Internet : seuls les services Render y accèdent

services:
  # API (Fastify)
  - type: web
    name: sainte-lucie-backend
    runtime: docker
    region: frankfurt
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/health
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: DATABASE_URL
        fromDatabase:
          name: sainte-lucie-db
          property: connectionString
      - key: UPLOAD_DIR
        value: /app/uploads
      - key: COOKIE_SECURE
        value: "true"
      # Au démarrage (voir backend/start.sh) : compte administrateur, puis contenu d'exemple recréé en arrière-plan
      # (ses images disparaissent avec le disque) : compter une à deux minutes avant qu'il soit complet.
      - key: SEED_ON_START
        value: "true"
      - key: DEMO_ON_START
        value: "true"
      - key: PAYMENT_MODE
        value: mock            # dons simulés : aucun vrai paiement (démonstration)
      - key: PUBLIC_URL
        value: https://sainte-lucie-site.onrender.com
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD    # 10 caractères minimum
        sync: false

  # Site public et administration (Nuxt) : relaie /api et /uploads vers l'API.
  - type: web
    name: sainte-lucie-site
    runtime: docker
    region: frankfurt
    plan: free
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    healthCheckPath: /robots.txt
    buildFilter:
      paths:
        - frontend/**
    envVars:
      # Adresse publique de l'API : un service gratuit ne reçoit pas de trafic par le réseau privé de Render.
      - key: NUXT_API_INTERNAL
        value: https://sainte-lucie-backend.onrender.com
      - key: NUXT_PUBLIC_SITE_URL
        value: https://sainte-lucie-site.onrender.com
