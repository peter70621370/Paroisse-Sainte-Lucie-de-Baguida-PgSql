# Environnement de DÉVELOPPEMENT (Docker Desktop)
# Lancement depuis la racine du projet :
#   docker compose --env-file .env -f deploiement/docker-compose.yml up --build
name: sainte-lucie-dev

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"   # interface web des e-mails de test
      - "1025:1025"                        # SMTP

  # Administration de la base (développement uniquement) : http://localhost:1030
  phpmyadmin:
    image: phpmyadmin:5
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      UPLOAD_LIMIT: 64M
    ports:
      - "${PHPMYADMIN_PORT:-1030}:80"
    depends_on:
      mysql:
        condition: service_healthy

  backend:
    build:
      context: ../backend
      target: dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      # Origines autorisées pour les requêtes qui modifient des données (le 2e nom sert aux tests de bout en bout dans Docker).
      CORS_ORIGIN: http://localhost:${FRONTEND_PORT:-3000},http://frontend:3000
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      UPLOAD_DIR: /app/uploads
      # E-mails de test : visibles sur http://localhost:8025 (Mailpit)
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      NOTIFY_EMAIL: ${NOTIFY_EMAIL:-secretariat@paroisse.test}
      # Dons : simulation locale (aucun vrai paiement). Les vrais prestataires sont configurés en production.
      PAYMENT_MODE: mock
      PUBLIC_URL: http://localhost:${FRONTEND_PORT:-3000}
    command: sh -c "npx prisma generate && npx prisma migrate deploy && npx tsx watch src/server.ts"
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    volumes:
      - ../backend:/app
      - backend_node_modules:/app/node_modules
      - uploads_data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      target: dev
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://backend:4000
      NUXT_PUBLIC_SITE_URL: http://localhost:${FRONTEND_PORT:-3000}
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_nuxt:/app/.nuxt
    depends_on:
      - backend

  # Tests de bout en bout (vrai navigateur) : docker compose --env-file .env -f deploiement/docker-compose.yml --profile e2e run --rm e2e
  e2e:
    profiles: ["e2e"]
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    working_dir: /e2e
    ipc: host
    environment:
      CI: "true"
      BASE_URL: http://frontend:3000
      MAILPIT_URL: http://mailpit:8025
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - ../e2e:/e2e
      - e2e_node_modules:/e2e/node_modules
    depends_on:
      - frontend
      - backend
    command: sh -c "npm install --no-audit --no-fund && npx playwright test"

volumes:
  e2e_node_modules:
  mysql_data:
  uploads_data:
  backend_node_modules:
  frontend_node_modules:
  frontend_nuxt:
