# Environnement de DÉVELOPPEMENT (Docker Desktop)
# Lancement depuis la racine du projet :
#   docker compose --env-file .env -f deploiement/docker-compose.yml up --build
name: sainte-lucie-dev

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"   # interface web des e-mails de test
      - "1025:1025"                        # SMTP

  # Administration de la base (développement uniquement) : http://localhost:5050
  # Sans écran de connexion ; le serveur « Sainte Lucie (dev) » est déjà enregistré, mot de passe compris.
  pgadmin:
    image: dpage/pgadmin4:9
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${ADMIN_EMAIL:-admin@paroissesaintelucie-baguida.org}
      PGADMIN_DEFAULT_PASSWORD: ${POSTGRES_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_SERVER_JSON_FILE: /tmp/servers.json
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "postgres:5432:*:$$POSTGRES_USER:$$POSTGRES_PASSWORD" > /tmp/pgpass && chmod 600 /tmp/pgpass
        printf '{"Servers":{"1":{"Name":"Sainte Lucie (dev)","Group":"Servers","Host":"postgres","Port":5432,"MaintenanceDB":"%s","Username":"%s","SSLMode":"prefer","PassFile":"/tmp/pgpass"}}}' "$$POSTGRES_DB" "$$POSTGRES_USER" > /tmp/servers.json
        exec /entrypoint.sh
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ../backend
      target: dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # Origines autorisées pour les requêtes qui modifient des données (le 2e nom sert aux tests de bout en bout dans Docker).
      CORS_ORIGIN: http://localhost:${FRONTEND_PORT:-3000},http://frontend:3000
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      UPLOAD_DIR: /app/uploads
      # E-mails de test : visibles sur http://localhost:8025 (Mailpit)
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      NOTIFY_EMAIL: ${NOTIFY_EMAIL:-secretariat@paroisse.test}
      # Dons : simulation locale (aucun vrai paiement). Les vrais prestataires sont configurés en production.
      PAYMENT_MODE: mock
      PUBLIC_URL: http://localhost:${FRONTEND_PORT:-3000}
    command: sh -c "npx prisma generate && npx prisma migrate deploy && npx tsx watch src/server.ts"
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    volumes:
      - ../backend:/app
      - backend_node_modules:/app/node_modules
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      target: dev
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://backend:4000
      NUXT_PUBLIC_SITE_URL: http://localhost:${FRONTEND_PORT:-3000}
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_nuxt:/app/.nuxt
    depends_on:
      - backend

  # Tests de bout en bout (vrai navigateur) : docker compose --env-file .env -f deploiement/docker-compose.yml --profile e2e run --rm e2e
  e2e:
    profiles: ["e2e"]
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    working_dir: /e2e
    ipc: host
    environment:
      CI: "true"
      BASE_URL: http://frontend:3000
      MAILPIT_URL: http://mailpit:8025
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - ../e2e:/e2e
      - e2e_node_modules:/e2e/node_modules
    depends_on:
      - frontend
      - backend
    command: sh -c "npm install --no-audit --no-fund && npx playwright test"

volumes:
  e2e_node_modules:
  postgres_data:
  pgadmin_data:
  uploads_data:
  backend_node_modules:
  frontend_node_modules:
  frontend_nuxt:
