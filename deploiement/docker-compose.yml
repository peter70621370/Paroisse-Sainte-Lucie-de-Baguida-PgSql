# Environnement de DÉVELOPPEMENT (Docker Desktop)
# Lancement depuis la racine du projet :
#   docker compose --env-file .env -f deploiement/docker-compose.yml up --build
name: sainte-lucie-dev

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"   # interface web des e-mails de test
      - "1025:1025"                        # SMTP

  backend:
    build:
      context: ../backend
      target: dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      CORS_ORIGIN: http://localhost:${FRONTEND_PORT:-3000}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      UPLOAD_DIR: /app/uploads
      # E-mails de test : visibles sur http://localhost:8025 (Mailpit)
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      NOTIFY_EMAIL: ${NOTIFY_EMAIL:-secretariat@paroisse.test}
    command: sh -c "npx prisma generate && npx prisma migrate deploy && npx tsx watch src/server.ts"
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    volumes:
      - ../backend:/app
      - backend_node_modules:/app/node_modules
      - uploads_data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      target: dev
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://backend:4000
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_nuxt:/app/.nuxt
    depends_on:
      - backend

volumes:
  mysql_data:
  uploads_data:
  backend_node_modules:
  frontend_node_modules:
  frontend_nuxt:
