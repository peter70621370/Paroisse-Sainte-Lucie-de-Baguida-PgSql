# Environnement de PRODUCTION / préproduction (VPS Contabo ou test local)
#   docker compose --env-file .env -f deploiement/docker-compose.prod.yml up -d --build
name: sainte-lucie-prod

services:
  postgres:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [internal]

  backend:
    build:
      context: ../backend
      target: prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CORS_ORIGIN: ${CORS_ORIGIN:-${PUBLIC_URL}}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      UPLOAD_DIR: /app/uploads
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-Paroisse Sainte Lucie de Baguida <no-reply@paroissesaintelucie-baguida.org>}
      NOTIFY_EMAIL: ${NOTIFY_EMAIL:-}
      PUBLIC_URL: ${PUBLIC_URL}
      PAYMENT_MODE: ${PAYMENT_MODE:-live}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      CINETPAY_API_KEY: ${CINETPAY_API_KEY:-}
      CINETPAY_SITE_ID: ${CINETPAY_SITE_ID:-}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_ENV: ${PAYPAL_ENV:-sandbox}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  frontend:
    build:
      context: ../frontend
      target: prod
    restart: always
    environment:
      NUXT_API_INTERNAL: http://backend:4000
      NUXT_PUBLIC_SITE_URL: ${PUBLIC_URL}
    depends_on:
      - backend
    networks: [internal]

  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks: [internal]

  # Sauvegarde quotidienne de la base et des fichiers (conservée 14 jours dans le volume backups)
  backup:
    image: postgres:17-alpine
    restart: always
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          pg_dump -h postgres -U "$$POSTGRES_USER" "$$POSTGRES_DB" | gzip > /backups/db_$$(date +%F_%H%M).sql.gz
          tar -czf /backups/uploads_$$(date +%F_%H%M).tar.gz -C /uploads . 2>/dev/null
          find /backups -type f -mtime +14 -name "*.gz" -delete
          sleep 86400
        done
    volumes:
      - backups:/backups
      - uploads_data:/uploads:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

networks:
  internal:

volumes:
  postgres_data:
  uploads_data:
  backups:
