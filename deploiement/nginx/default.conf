# Nginx : point d'entrée public (le HTTPS est ajouté à la mise en production, voir README).
# - /api et /uploads -> backend ; tout le reste -> frontend (Nuxt).
# - Nginx est le SEUL proxy exposé : il REMPLACE X-Forwarded-For par la vraie adresse du client
#   (le backend ignore donc tout ce que le visiteur écrit lui-même dans cet en-tête).

server_tokens off;

# Les conteneurs peuvent être recréés (mise à jour) et changer d'adresse interne : Nginx doit re-résoudre leurs noms
# régulièrement via le DNS de Docker, sinon il enverrait les requêtes dans le vide (erreur 502).
resolver 127.0.0.11 valid=5s ipv6=off;

# Limitation de débit des routes sensibles (en plus de celles du backend)
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_status 429;

# Compression
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/ld+json application/manifest+json application/xml image/svg+xml;

server {
    listen 80;
    server_name _;

    client_max_body_size 25m;
    client_body_timeout 30s;
    client_header_timeout 15s;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;

    set $backend_upstream  http://backend:4000;
    set $frontend_upstream http://frontend:3000;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;   # remplace (n'ajoute pas) : pas de falsification possible
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass $backend_upstream;
    }

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass $backend_upstream;
    }

    location /uploads/ {
        proxy_pass $backend_upstream;
    }

    # Images provisoires fournies avec le site : cache d'un jour (elles changent rarement)
    location /placeholders/ {
        proxy_pass $frontend_upstream;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # Assets compilés de Nuxt : noms avec empreinte -> cache d'un an
    location /_nuxt/ {
        proxy_pass $frontend_upstream;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        proxy_pass $frontend_upstream;
    }
}
